name: Verify macOS bundles and tag v1.0.102 (one-off)

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/verify-and-tag-v1.0.102.yml

permissions:
  contents: read

jobs:
  verify-macos:
    name: Verify release app ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            arch: arm64
          - os: macos-15-intel
            rid: osx-x64
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ff1fc20638bf1bbc43161249204c0af3101da4cb
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore, build and test
        run: |
          dotnet restore CSharpFar.slnx
          dotnet build CSharpFar.slnx --configuration Release --no-restore
          dotnet test CSharpFar.slnx --configuration Release --no-build --verbosity minimal
      - name: Build and verify packaged macOS app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:RUNNER_TEMP 'publish'
          $outputDir = Join-Path $env:RUNNER_TEMP 'bundle'
          dotnet publish src/CSharpFar.Host.MacOs/CSharpFar.Host.MacOs.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            --output $publishDir `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /p:Version=1.0.102
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }

          & ./eng/packaging/build-macos-app.ps1 `
            -PublishDir $publishDir -Version '1.0.102' -OutputDir $outputDir | Out-Host

          $appDir = Join-Path $outputDir 'CSharpFar.app'
          if (-not (Test-Path -LiteralPath $appDir -PathType Container)) {
            throw "App bundle not found: $appDir"
          }
          $zip = Join-Path $env:RUNNER_TEMP 'CSharpFar-app.zip'
          & /usr/bin/ditto -c -k --sequesterRsrc --keepParent $appDir $zip
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw 'macOS ZIP packaging failed'
          }
          & /usr/bin/unzip -t $zip | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'macOS ZIP integrity check failed' }
          $actualArch = (& /usr/bin/lipo -archs (Join-Path $appDir 'Contents/MacOS/CSharpFarHost')).Trim()
          if ($actualArch -ne '${{ matrix.arch }}') {
            throw "Expected ${{ matrix.arch }} desktop host, got '$actualArch'"
          }
          & (Join-Path $appDir 'Contents/MacOS/CSharpFar') --check-system-git
          if ($LASTEXITCODE -ne 0) { throw 'macOS app launch check failed' }

  create-tag-and-release:
    name: Publish v1.0.102 after both macOS checks pass
    needs: verify-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create tag and dispatch the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.102" >/dev/null 2>&1; then
            echo "::error::Tag v1.0.102 already exists; refusing to move it."
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/v1.0.102 \
            -f sha=ff1fc20638bf1bbc43161249204c0af3101da4cb --silent
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v1.0.102
