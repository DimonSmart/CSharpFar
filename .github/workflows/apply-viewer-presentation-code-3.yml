name: Run viewer presentation build validation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-viewer-presentation-code-3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply source integration patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-viewer-presentation.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply integration patch\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('      - name: Verify diff\n', start)
          script = textwrap.dedent(workflow[start:end])
          script = script[:script.index('# Documentation and built-in help.')]
          exec(compile(script, 'apply-viewer-presentation.py', 'exec'))

      - name: Show diff summary
        run: git diff --stat

      - name: Restore
        run: dotnet restore CSharpFar.slnx

      - name: Build
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpFar.slnx --configuration Release --no-build --verbosity minimal

      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-viewer-presentation.yml
          rm .github/workflows/apply-viewer-presentation-code.yml
          rm .github/workflows/apply-viewer-presentation-code-2.yml
          rm .github/workflows/apply-viewer-presentation-code-3.yml
          git add -A
          git commit -m "Implement automatic viewer presentation"
          git push origin HEAD:master
