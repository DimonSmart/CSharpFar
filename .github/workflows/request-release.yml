name: Request Release

on:
  push:
    branches: [main]
    paths:
      - eng/packaging/release-request.txt

permissions:
  contents: write
  actions: write

concurrency:
  group: csharpfar-release-request
  cancel-in-progress: false

jobs:
  request-release:
    name: Create release tag and dispatch packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate requested version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '\r\n' < eng/packaging/release-request.txt)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release request must be a vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::Release tag $tag already exists."
            exit 1
          fi

          previous="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [[ -n "$previous" ]]; then
            newest="$(printf '%s\n%s\n' "$previous" "$tag" | sort -V | tail -n 1)"
            if [[ "$newest" != "$tag" || "$previous" == "$tag" ]]; then
              echo "::error::$tag must be newer than $previous."
              exit 1
            fi
          fi

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Validated next release: $tag (previous: $previous)"

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "CSharpFar $RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      # GITHUB_TOKEN tag pushes do not trigger push workflows. An explicit
      # workflow_dispatch does, and the existing release.yml supports tag refs.
      - name: Start existing release workflow for tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          echo "Dispatched release.yml for $RELEASE_TAG"
