name: Homebrew

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the Homebrew formula and Cask (for example v1.0.60)
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - eng/packaging/homebrew-current-tag.txt

permissions:
  contents: write

jobs:
  update-homebrew:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve release tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_run") {
            $headSha = "${{ github.event.workflow_run.head_sha }}"
            $tag = git tag --points-at $headSha --list "v*.*.*" --sort=-v:refname |
              Select-Object -First 1
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}") {
            $tag = "${{ inputs.tag }}"
          }
          else {
            $tag = (Get-Content -Raw eng/packaging/homebrew-current-tag.txt).Trim()
          }

          if (-not $tag -or $tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Could not resolve a vMAJOR.MINOR.PATCH release tag. Got '$tag'."
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV

      - name: Download release checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "homebrew"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null

          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "SHA256SUMS.txt" `
            --dir $downloadDir

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download SHA256SUMS.txt for $env:RELEASE_TAG."
          }

          "CHECKSUMS_PATH=$(Join-Path $downloadDir 'SHA256SUMS.txt')" >> $env:GITHUB_ENV

      - name: Generate Homebrew formula and Cask
        shell: pwsh
        run: |
          ./eng/packaging/update-homebrew-formula.ps1 `
            -Version $env:VERSION `
            -ChecksumsPath $env:CHECKSUMS_PATH `
            -OutputPath Formula/csharpfar.rb

          ./eng/packaging/update-homebrew-cask.ps1 `
            -Version $env:VERSION `
            -ChecksumsPath $env:CHECKSUMS_PATH `
            -OutputPath Casks/csharpfar-app.rb

          $env:RELEASE_TAG | Set-Content -Path eng/packaging/homebrew-current-tag.txt -Encoding ascii

      - name: Validate Ruby syntax
        run: |
          ruby -c Formula/csharpfar.rb
          ruby -c Casks/csharpfar-app.rb

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          core: false
          cask: false

      - name: Validate Homebrew metadata
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          brew tap-new dimonsmart/csharpfar
          tap_dir="$(brew --repository dimonsmart/csharpfar)"
          mkdir -p "$tap_dir/Formula" "$tap_dir/Casks"
          cp Formula/csharpfar.rb "$tap_dir/Formula/csharpfar.rb"
          cp Casks/csharpfar-app.rb "$tap_dir/Casks/csharpfar-app.rb"

          brew audit --formula --strict dimonsmart/csharpfar/csharpfar
          brew audit --cask --strict dimonsmart/csharpfar/csharpfar-app

      - name: Commit Homebrew metadata
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/csharpfar.rb Casks/csharpfar-app.rb eng/packaging/homebrew-current-tag.txt

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Homebrew metadata is already up to date."
            exit 0
          }

          git commit -m "Update Homebrew metadata for $env:RELEASE_TAG"
          git push origin HEAD:master
