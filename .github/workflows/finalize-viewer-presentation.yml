name: Finalize viewer presentation behavior and docs

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/finalize-viewer-presentation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply final fixes and docs
        run: python .github/scripts/finalize_viewer_presentation.py

      - name: Restore
        run: dotnet restore CSharpFar.slnx

      - name: Build
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpFar.slnx --configuration Release --no-build --verbosity minimal

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-viewer-presentation.yml
          rm .github/scripts/finalize_viewer_presentation.py
          git add -A
          git commit -m "Finalize viewer presentation behavior and tests"
          git push origin HEAD:master
