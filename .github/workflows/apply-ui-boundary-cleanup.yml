name: Apply UI boundary cleanup

on:
  push:
    branches:
      - codex/remove-ui-product-friend-final

jobs:
  patch:
    if: github.event.head_commit.message == 'Run boundary cleanup patch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_ui_boundary_cleanup.py')
          text = path.read_text()
          text = text.replace(
              "'fixture.Services.Composition.PushOverlay('",
              "'.Services.Composition.PushOverlay('")
          text = text.replace(
              "'fixture.Services.Composition.RegisterPersistentOverlay('",
              "'.Services.Composition.RegisterPersistentOverlay('")
          path.write_text(text)
          PY
          python3 .github/scripts/apply_ui_boundary_cleanup.py
          cat > tests/CSharpFar.Ui.Tests/UiThemeTests.cs <<'EOF'
          namespace CSharpFar.Ui.Tests;

          public sealed class UiThemeTests
          {
              [Fact]
              public void TemporaryThemeScope_RestoresThemeAfterException()
              {
                  var temporary = new ConsolePalette { Name = "Temporary" };
                  UiTheme.ResetForTests();
                  UiTheme.Initialize(PaletteRegistry.Default);
                  try
                  {
                      void ThrowDuringTemporaryScope()
                      {
                          using (UiTheme.UseTemporary(temporary))
                          {
                              Assert.Same(temporary, UiTheme.Current);
                              throw new InvalidOperationException("render failed");
                          }
                      }

                      Assert.Throws<InvalidOperationException>((Action)ThrowDuringTemporaryScope);
                      Assert.Same(PaletteRegistry.Default, UiTheme.Current);
                  }
                  finally
                  {
                      UiTheme.ResetForTests();
                  }
              }

              [Fact]
              public void TemporaryThemeScope_RestoresNestedThemesInOrder()
              {
                  var temporary = new ConsolePalette { Name = "Temporary" };
                  UiTheme.ResetForTests();
                  UiTheme.Initialize(PaletteRegistry.Default);
                  try
                  {
                      using (UiTheme.UseTemporary(temporary))
                      {
                          Assert.Same(temporary, UiTheme.Current);
                          using (UiTheme.UseTemporary(PaletteRegistry.Default))
                              Assert.Same(PaletteRegistry.Default, UiTheme.Current);
                          Assert.Same(temporary, UiTheme.Current);
                      }

                      Assert.Same(PaletteRegistry.Default, UiTheme.Current);
                  }
                  finally
                  {
                      UiTheme.ResetForTests();
                  }
              }
          }
          EOF
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove UI product friend access"
          git push origin HEAD:codex/remove-ui-product-friend-final
