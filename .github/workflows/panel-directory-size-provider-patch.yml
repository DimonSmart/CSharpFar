name: Panel directory size provider patch

on:
  push:
    branches:
      - feature/panel-directory-sizes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Patch provider link metadata')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve provider link metadata
        shell: python
        run: |
          from pathlib import Path

          sftp_path = Path('src/CSharpFar.Module.Sftp/SftpFilePanelSource.cs')
          sftp = sftp_path.read_text(encoding='utf-8')
          sftp = sftp.replace(
              'Attributes = attributes.IsDirectory ? FileAttributes.Directory : FileAttributes.Normal,',
              'Attributes = ToPanelAttributes(attributes.IsDirectory, attributes.IsSymbolicLink),')
          sftp = sftp.replace(
              'Attributes = item.IsDirectory ? FileAttributes.Directory : FileAttributes.Normal,',
              'Attributes = ToPanelAttributes(item.IsDirectory, item.IsSymbolicLink),')
          marker = '    private SftpClient CreateConnectedClient()\n'
          helper = '''    internal static FileAttributes ToPanelAttributes(bool isDirectory, bool isSymbolicLink)\n    {\n        FileAttributes attributes = isDirectory ? FileAttributes.Directory : FileAttributes.Normal;\n        if (isSymbolicLink)\n            attributes |= FileAttributes.ReparsePoint;\n        return attributes;\n    }\n\n'''
          if 'internal static FileAttributes ToPanelAttributes' not in sftp:
              if marker not in sftp:
                  raise SystemExit('SFTP insertion point not found')
              sftp = sftp.replace(marker, helper + marker, 1)
          sftp_path.write_text(sftp, encoding='utf-8')

          ftp_path = Path('src/CSharpFar.Module.Ftp/FtpFilePanelSource.cs')
          ftp = ftp_path.read_text(encoding='utf-8')
          ftp = ftp.replace(
              'Attributes = isDirectory ? FileAttributes.Directory : FileAttributes.Normal,',
              'Attributes = ToPanelAttributes(isDirectory, item.Type == FtpObjectType.Link),')
          marker = '    private FilePanelItem ToDirectoryItem(string path, DateTime lastWriteTime) =>\n'
          helper = '''    internal static FileAttributes ToPanelAttributes(bool isDirectory, bool isSymbolicLink)\n    {\n        FileAttributes attributes = isDirectory ? FileAttributes.Directory : FileAttributes.Normal;\n        if (isSymbolicLink)\n            attributes |= FileAttributes.ReparsePoint;\n        return attributes;\n    }\n\n'''
          if 'internal static FileAttributes ToPanelAttributes' not in ftp:
              if marker not in ftp:
                  raise SystemExit('FTP insertion point not found')
              ftp = ftp.replace(marker, helper + marker, 1)
          ftp_path.write_text(ftp, encoding='utf-8')

      - name: Commit provider metadata patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/CSharpFar.Module.Sftp/SftpFilePanelSource.cs src/CSharpFar.Module.Ftp/FtpFilePanelSource.cs
          git diff --cached --quiet && exit 0
          git commit -m "Preserve SFTP and FTP link metadata"
          git push origin HEAD:feature/panel-directory-sizes
