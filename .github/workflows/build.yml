name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CSharpFar.slnx

      - name: Build
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore

      - name: Validate macOS installer script
        if: runner.os == 'Linux'
        run: bash -n docs/install-macos.sh

      - name: Test
        run: dotnet test CSharpFar.slnx --configuration Release --no-build --verbosity minimal

      - name: Build cross-process history probe
        run: dotnet build tools/CSharpFar.HistorySmoke/CSharpFar.HistorySmoke.csproj --configuration Release

      - name: Verify cross-process history writes
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "csharpfar-history-smoke"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $dll = Join-Path $PWD "tools/CSharpFar.HistorySmoke/bin/Release/net10.0/CSharpFar.HistorySmoke.dll"
          $a = Start-Process dotnet -ArgumentList @($dll, $directory, "A") -PassThru
          $b = Start-Process dotnet -ArgumentList @($dll, $directory, "B") -PassThru
          $a.WaitForExit()
          $b.WaitForExit()
          if ($a.ExitCode -ne 0 -or $b.ExitCode -ne 0) {
            throw "One of the history writers failed."
          }
          dotnet $dll $directory verify
          if ($LASTEXITCODE -ne 0) { throw "Cross-process history verification failed." }

      - name: Verify reusable packages
        shell: pwsh
        run: ./eng/verify-reusable-packages.ps1
