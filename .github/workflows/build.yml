name: Bootstrap Markdown Links

on:
  push:
    branches:
      - "chatgpt/markdown-links-bootstrap"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix bootstrap patch
        run: |
          python3 .github/scripts/fixup-markdown-links.py
          python3 .github/scripts/fixup-markdown-links-2.py

      - name: Apply implementation
        run: python3 .github/scripts/apply-markdown-links.py

      - name: Commit generated implementation
        shell: bash
        run: |
          rm -f .github/scripts/fixup-markdown-links.py .github/scripts/fixup-markdown-links-2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add clickable Markdown links"
          git push
