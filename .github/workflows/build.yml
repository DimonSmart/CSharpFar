name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CSharpFar.slnx

      - name: Build
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore

      - name: Verify development extension deployment
        shell: pwsh
        run: ./eng/testing/verify-development-extensions.ps1

      - name: Verify plugin SDK binary compatibility
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/testing/verify-plugin-sdk-compatibility.ps1

      - name: Enforce CA1416 platform guards
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore -warnaserror:CA1416

      - name: Verify RID-specific publish closure and host self-test
        shell: pwsh
        run: |
          $platform = switch ($env:RUNNER_OS) {
            'Windows' { 'Windows' }
            'Linux' { 'Linux' }
            'macOS' { 'MacOs' }
            default { throw "Unsupported runner OS: $env:RUNNER_OS" }
          }
          $rid = switch ($env:RUNNER_OS) {
            'Windows' { 'win-x64' }
            'Linux' { 'linux-x64' }
            'macOS' { if ($env:RUNNER_ARCH -eq 'ARM64') { 'osx-arm64' } else { 'osx-x64' } }
          }
          ./eng/verify-published-platform-closure.ps1 -Project "src/CSharpFar.Host.$platform/CSharpFar.Host.$platform.csproj" -RuntimeIdentifier $rid

      - name: Validate macOS installer script
        if: runner.os == 'Linux'
        run: bash -n docs/install-macos.sh

      - name: Download verified RAR and 7z test archives
        shell: pwsh
        run: ./eng/testing/download-archive-fixtures.ps1

      - name: Build independent external plugin binaries
        shell: pwsh
        run: ./eng/testing/build-external-plugin-samples.ps1

      - name: Verify plugin SDK package contents
        shell: pwsh
        run: ./eng/testing/verify-plugin-sdk-packages.ps1

      - name: Verify packaged dotnet new plugin template
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/testing/verify-plugin-template.ps1

      - name: Verify self-contained single-file external plugin loading
        shell: pwsh
        run: |
          $platform = switch ($env:RUNNER_OS) {
            'Windows' { 'Windows' }
            'Linux' { 'Linux' }
            'macOS' { 'MacOs' }
          }
          $rid = switch ($env:RUNNER_OS) {
            'Windows' { 'win-x64' }
            'Linux' { 'linux-x64' }
            'macOS' { if ($env:RUNNER_ARCH -eq 'ARM64') { 'osx-arm64' } else { 'osx-x64' } }
          }
          ./eng/testing/verify-external-plugins-published.ps1 -Project "src/CSharpFar.Host.$platform/CSharpFar.Host.$platform.csproj" -RuntimeIdentifier $rid

      - name: Test
        env:
          CSHARPFAR_ARCHIVE_FIXTURES: ${{ github.workspace }}/tests/archive-fixtures
          CSHARPFAR_EXTERNAL_HELLO: ${{ github.workspace }}/artifacts/external-hello
          CSHARPFAR_EXTERNAL_GOODBYE: ${{ github.workspace }}/artifacts/external-goodbye
        run: dotnet test CSharpFar.slnx --configuration Release --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type none --logger "console;verbosity=normal" --no-build --verbosity minimal

      - name: Verify safe publication against real FTP and SFTP servers
        if: runner.os == 'Linux'
        shell: bash
        run: bash eng/testing/run-file-publication-integration.sh

      - name: Verify Unix child interruption and panel restoration
        if: runner.os != 'Windows'
        shell: bash
        run: |
          host=Linux
          if [ "$RUNNER_OS" = "macOS" ]; then host=MacOs; fi
          python3 eng/testing/verify-unix-child-interrupt.py "src/CSharpFar.Host.$host/bin/Release/net10.0/csharpfar.dll"

      - name: Build cross-process history probe
        run: dotnet build tools/CSharpFar.HistorySmoke/CSharpFar.HistorySmoke.csproj --configuration Release

      - name: Verify cross-process history writes
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "csharpfar-history-smoke"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $dll = Join-Path $PWD "tools/CSharpFar.HistorySmoke/bin/Release/net10.0/CSharpFar.HistorySmoke.dll"
          $a = Start-Process dotnet -ArgumentList @($dll, $directory, "A") -PassThru
          $b = Start-Process dotnet -ArgumentList @($dll, $directory, "B") -PassThru
          $a.WaitForExit()
          $b.WaitForExit()
          if ($a.ExitCode -ne 0 -or $b.ExitCode -ne 0) {
            throw "One of the history writers failed."
          }
          dotnet $dll $directory verify
          if ($LASTEXITCODE -ne 0) { throw "Cross-process history verification failed." }

      - name: Verify reusable packages
        shell: pwsh
        run: ./eng/verify-reusable-packages.ps1
