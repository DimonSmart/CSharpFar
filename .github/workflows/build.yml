name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CSharpFar.slnx

      - name: Build
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore

      - name: Validate macOS installer script
        if: runner.os == 'Linux'
        run: bash -n docs/install-macos.sh

      - name: Test
        run: dotnet test CSharpFar.slnx --configuration Release --no-build --verbosity minimal

      - name: Verify reusable packages
        shell: pwsh
        run: ./eng/verify-reusable-packages.ps1

      - name: Network Traffic ETW feasibility probe (non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: dotnet run --project tools/NetworkTraffic.EtwSpike/NetworkTraffic.EtwSpike.csproj --configuration Release -- --output etw-spike-result.json

      - name: Upload ETW feasibility evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: network-traffic-etw-spike
          path: etw-spike-result.json
          if-no-files-found: warn

