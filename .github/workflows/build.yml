name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CSharpFar.slnx

      - name: Build
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore

      - name: Build Demo directly
        run: dotnet build samples/CSharpFar.Ui.Demo/CSharpFar.Ui.Demo.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpFar.slnx --configuration Release --no-build --verbosity minimal

      - name: Demo ANSI runtime smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          (sleep 1; printf '\033OP'; sleep 1; printf '\033'; sleep 1; printf '\033OQ'; sleep 1; printf '\033'; sleep 1; printf '\033[21~') \
            | timeout 20s script -qec 'dotnet run --project samples/CSharpFar.Ui.Demo/CSharpFar.Ui.Demo.csproj --configuration Release --no-build' /dev/null
