name: Semantic UI public API baseline

on:
  workflow_dispatch:
  push:
    branches:
      - semantic-transient-ui-boundary

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true

jobs:
  update-public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CSharpFar.slnx
      - name: Apply RS0016 fixes
        run: dotnet format CSharpFar.slnx analyzers --diagnostics RS0016 --no-restore
      - name: Commit generated public API baseline
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CSharpFar.Ui/PublicAPI*.txt src/CSharpFar.Ui/PublicAPI.*/*.txt || true
          git commit -m "Update semantic UI public API baseline"
          git push
