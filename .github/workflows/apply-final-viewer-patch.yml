name: Apply final viewer presentation patch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-final-viewer-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes and docs
        run: python .github/scripts/finalize_viewer_presentation.py

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-final-viewer-patch.yml
          rm .github/workflows/finalize-viewer-presentation.yml
          rm .github/scripts/finalize_viewer_presentation.py
          git add -A
          git commit -m "Finalize viewer presentation behavior and tests"
          git push origin HEAD:master
