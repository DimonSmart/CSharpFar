name: Apply viewer presentation integration

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-viewer-presentation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply integration patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              with p.open('r', encoding='utf-8', newline='') as f:
                  text = f.read()
              eol = '\r\n' if '\r\n' in text else '\n'
              old = old.replace('\n', eol)
              new = new.replace('\n', eol)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
              with p.open('w', encoding='utf-8', newline='') as f:
                  f.write(text)

          # Bounded backward line lookup used only by presentation context recovery.
          replace_once('src/CSharpFar.App/Viewer/LineScanner.cs', '''
              public async Task<long> FindPreviousLineStartAsync(
                  long lineStartOffset,
                  CancellationToken cancellationToken = default)
              {
                  if (lineStartOffset <= ContentStartOffset)
                      return ContentStartOffset;

                  long searchBeforeDelimiter = Math.Max(ContentStartOffset, lineStartOffset - NewLineWidth);
                  long? previousNewLine = await FindPreviousNewLineBeforeAsync(searchBeforeDelimiter, cancellationToken)
                      .ConfigureAwait(false);
                  return previousNewLine.HasValue
                      ? Math.Min(_reader.Length, previousNewLine.Value + NewLineWidth)
                      : ContentStartOffset;
              }
          ''', '''
              public async Task<long> FindPreviousLineStartAsync(
                  long lineStartOffset,
                  CancellationToken cancellationToken = default)
              {
                  if (lineStartOffset <= ContentStartOffset)
                      return ContentStartOffset;

                  long searchBeforeDelimiter = Math.Max(ContentStartOffset, lineStartOffset - NewLineWidth);
                  long? previousNewLine = await FindPreviousNewLineBeforeAsync(searchBeforeDelimiter, cancellationToken)
                      .ConfigureAwait(false);
                  return previousNewLine.HasValue
                      ? Math.Min(_reader.Length, previousNewLine.Value + NewLineWidth)
                      : ContentStartOffset;
              }

              public async Task<long?> TryFindPreviousLineStartAsync(
                  long lineStartOffset,
                  int maxLookBehindBytes,
                  CancellationToken cancellationToken = default)
              {
                  if (lineStartOffset <= ContentStartOffset || maxLookBehindBytes <= 0)
                      return null;

                  long minimumOffset = Math.Max(ContentStartOffset, lineStartOffset - maxLookBehindBytes);
                  long searchBeforeDelimiter = Math.Max(ContentStartOffset, lineStartOffset - NewLineWidth);
                  long? previousNewLine = await FindPreviousNewLineBeforeAsync(
                          searchBeforeDelimiter,
                          minimumOffset,
                          cancellationToken)
                      .ConfigureAwait(false);
                  if (previousNewLine.HasValue)
                      return Math.Min(_reader.Length, previousNewLine.Value + NewLineWidth);

                  return minimumOffset == ContentStartOffset ? ContentStartOffset : null;
              }
          ''')

          replace_once('src/CSharpFar.App/Viewer/LineScanner.cs', '''
              private async Task<long?> FindPreviousNewLineBeforeAsync(
                  long offsetExclusive,
                  CancellationToken cancellationToken)
              {
                  long searchOffset = Math.Min(offsetExclusive, _reader.Length);
                  while (searchOffset > ContentStartOffset)
                  {
                      long blockStart = (searchOffset - 1) / _cache.BlockSize * _cache.BlockSize;
                      ReadOnlyMemory<byte> block = await _cache.ReadBlockAsync(blockStart, cancellationToken)
                          .ConfigureAwait(false);
                      if (block.IsEmpty)
                          break;

                      int end = (int)Math.Min(searchOffset - blockStart, block.Length);
                      int index = FindLastNewLine(block.Span[..end], blockStart);
                      if (index >= 0)
                          return blockStart + index;

                      searchOffset = blockStart;
                  }

                  return null;
              }
          ''', '''
              private Task<long?> FindPreviousNewLineBeforeAsync(
                  long offsetExclusive,
                  CancellationToken cancellationToken) =>
                  FindPreviousNewLineBeforeAsync(offsetExclusive, ContentStartOffset, cancellationToken);

              private async Task<long?> FindPreviousNewLineBeforeAsync(
                  long offsetExclusive,
                  long minimumOffset,
                  CancellationToken cancellationToken)
              {
                  long searchOffset = Math.Min(offsetExclusive, _reader.Length);
                  minimumOffset = Math.Clamp(minimumOffset, ContentStartOffset, searchOffset);
                  while (searchOffset > minimumOffset)
                  {
                      long blockStart = (searchOffset - 1) / _cache.BlockSize * _cache.BlockSize;
                      ReadOnlyMemory<byte> block = await _cache.ReadBlockAsync(blockStart, cancellationToken)
                          .ConfigureAwait(false);
                      if (block.IsEmpty)
                          break;

                      int end = (int)Math.Min(searchOffset - blockStart, block.Length);
                      int index = FindLastNewLine(block.Span[..end], blockStart);
                      if (index >= 0)
                      {
                          long absoluteOffset = blockStart + index;
                          return absoluteOffset >= minimumOffset ? absoluteOffset : null;
                      }

                      if (blockStart <= minimumOffset)
                          break;

                      searchOffset = blockStart;
                  }

                  return null;
              }
          ''')

          # Presentation mode and cache are Viewer-session state; decoded cache resets on scanner changes.
          replace_once('src/CSharpFar.App/Viewer/LargeFileViewerState.cs', '''
              public ViewerSearchRequest? LastSearch { get; set; }
              public ViewerSearchMatch? SearchMatch { get; set; }

              public bool IsHexMode => ViewMode == LargeFileViewMode.Hex;
          ''', '''
              public ViewerSearchRequest? LastSearch { get; set; }
              public ViewerSearchMatch? SearchMatch { get; set; }
              public ViewerPresentationMode PresentationMode { get; set; } = ViewerPresentationMode.Auto;
              public ViewerPresentationSession Presentation { get; } = new();

              public bool IsHexMode => ViewMode == LargeFileViewMode.Hex;
          ''')
          replace_once('src/CSharpFar.App/Viewer/LargeFileViewerState.cs', '''
                  LineIndex = new SparseLineIndex();
                  LineIndex.Add(1, lineScanner.ContentStartOffset);
                  SearchMatch = null;
          ''', '''
                  LineIndex = new SparseLineIndex();
                  LineIndex.Add(1, lineScanner.ContentStartOffset);
                  SearchMatch = null;
                  Presentation.Reset();
          ''')

          # Keep Auto/Raw when + / - opens a sibling, while rebuilding source-derived presentation cache.
          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
                          reader.Dispose();
                          reader = null;

                          filePath = nextPath;
                          opened = OpenViewerFile(filePath);
                          reader = opened.Reader;
                          state = opened.State;
                          options.CurrentFileChanged?.Invoke(filePath);
          ''', '''
                          var presentationMode = state.PresentationMode;
                          reader.Dispose();
                          reader = null;

                          filePath = nextPath;
                          opened = OpenViewerFile(filePath);
                          reader = opened.Reader;
                          state = opened.State;
                          state.PresentationMode = presentationMode;
                          options.CurrentFileChanged?.Invoke(filePath);
          ''')

          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
                      case ConsoleKey.F5:
                          ShowUnsupported("Raw/processed viewer mode");
                          break;
          ''', '''
                      case ConsoleKey.F5 when !shift && !alt && !control:
                          state.PresentationMode = state.PresentationMode == ViewerPresentationMode.Auto
                              ? ViewerPresentationMode.Raw
                              : ViewerPresentationMode.Auto;
                          break;
          ''')

          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
                  var view = state.IsHexMode
                      ? DrawBinaryContent(canvas, reader, state, contentHeight, size.Width)
                      : DrawTextContent(canvas, reader, state, contentHeight, size.Width);
          ''', '''
                  var view = state.IsHexMode
                      ? DrawBinaryContent(canvas, reader, state, contentHeight, size.Width)
                      : DrawTextContent(canvas, filePath, reader, state, contentHeight, size.Width);
          ''')

          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
              private LargeFileRenderView DrawTextContent(
                  IUiCanvas canvas,
                  IFileByteReader reader,
                  LargeFileViewerState state,
                  int contentHeight,
                  int width)
              {
                  return state.WrapLines
                      ? DrawWrappedTextContent(canvas, reader, state, contentHeight, width)
                      : DrawUnwrappedTextContent(canvas, state, contentHeight, width);
              }
          ''', '''
              private LargeFileRenderView DrawTextContent(
                  IUiCanvas canvas,
                  string sourcePath,
                  IFileByteReader reader,
                  LargeFileViewerState state,
                  int contentHeight,
                  int width)
              {
                  return state.WrapLines
                      ? DrawWrappedTextContent(canvas, sourcePath, reader, state, contentHeight, width)
                      : DrawUnwrappedTextContent(canvas, sourcePath, state, contentHeight, width);
              }
          ''')

          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
              private LargeFileRenderView DrawUnwrappedTextContent(
                  IUiCanvas canvas,
                  LargeFileViewerState state,
                  int contentHeight,
                  int width)
              {
                  int bytesPerLine = Math.Max(256, (state.HorizontalOffset + width + 32) * 4);
                  var scanned = state.LineScanner
                      .ReadLinesAsync(state.TopByteOffset, contentHeight, bytesPerLine)
                      .GetAwaiter()
                      .GetResult();

                  for (int row = 0; row < contentHeight; row++)
                  {
                      if (row < scanned.Lines.Count)
                      {
                          var line = scanned.Lines[row];
                          WriteTextLine(canvas, line.Text, row + 1, state.HorizontalOffset, width, state.SearchMatch, line.StartOffset, segmentStartIndex: 0);
                      }
                      else
                      {
                          canvas.WriteForced(0, row + 1, new string(' ', width), CSharpFarPaletteStyles.CommandLine(_palette));
                      }
                  }

                  return new LargeFileRenderView(scanned.Lines, scanned.NextOffset);
              }
          ''', '''
              private LargeFileRenderView DrawUnwrappedTextContent(
                  IUiCanvas canvas,
                  string sourcePath,
                  LargeFileViewerState state,
                  int contentHeight,
                  int width)
              {
                  int bytesPerLine = Math.Max(256, (state.HorizontalOffset + width + 32) * 4);
                  var scanned = state.LineScanner
                      .ReadLinesAsync(state.TopByteOffset, contentHeight, bytesPerLine)
                      .GetAwaiter()
                      .GetResult();
                  var presented = state.Presentation.Present(
                      state.PresentationMode,
                      sourcePath,
                      state.LineScanner,
                      scanned.Lines,
                      width);

                  for (int row = 0; row < contentHeight; row++)
                  {
                      if (row < scanned.Lines.Count)
                      {
                          var line = ResolvePresentationForSearch(presented[row], state.SearchMatch);
                          WriteTextLine(
                              canvas,
                              line,
                              line.Text,
                              row + 1,
                              state.HorizontalOffset,
                              width,
                              state.SearchMatch,
                              segmentStartIndex: 0);
                      }
                      else
                      {
                          canvas.WriteForced(0, row + 1, new string(' ', width), CSharpFarPaletteStyles.CommandLine(_palette));
                      }
                  }

                  return new LargeFileRenderView(scanned.Lines, scanned.NextOffset);
              }
          ''')

          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
              private LargeFileRenderView DrawWrappedTextContent(
                  IUiCanvas canvas,
                  IFileByteReader reader,
                  LargeFileViewerState state,
                  int contentHeight,
                  int width)
          ''', '''
              private LargeFileRenderView DrawWrappedTextContent(
                  IUiCanvas canvas,
                  string sourcePath,
                  IFileByteReader reader,
                  LargeFileViewerState state,
                  int contentHeight,
                  int width)
          ''')

          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
                      var line = scanned.Lines[0];
                      lines.Add(line);
                      nextOffset = line.NextOffset;

                      foreach (var segment in SplitWrappedLine(line.Text, Math.Max(1, width), state.WordWrap))
                      {
                          if (row >= contentHeight)
                              break;

                          WriteTextLine(canvas, segment.Text, row + 1, scrollLeft: 0, width, state.SearchMatch, line.StartOffset, segment.StartIndex);
                          row++;
                      }
          ''', '''
                      var line = scanned.Lines[0];
                      lines.Add(line);
                      nextOffset = line.NextOffset;
                      var presented = state.Presentation.Present(
                          state.PresentationMode,
                          sourcePath,
                          state.LineScanner,
                          [line],
                          width)[0];
                      presented = ResolvePresentationForSearch(presented, state.SearchMatch);

                      foreach (var segment in SplitWrappedLine(presented.Text, Math.Max(1, width), state.WordWrap))
                      {
                          if (row >= contentHeight)
                              break;

                          WriteTextLine(
                              canvas,
                              presented,
                              segment.Text,
                              row + 1,
                              scrollLeft: 0,
                              width,
                              state.SearchMatch,
                              segment.StartIndex);
                          row++;
                      }
          ''')

          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
              private void WriteTextLine(
                  IUiCanvas canvas,
                  string line,
                  int y,
                  int scrollLeft,
                  int width,
                  ViewerSearchMatch? match,
                  long lineStartOffset,
                  int segmentStartIndex)
              {
                  if (width <= 0)
                      return;

                  var layout = new ViewerTextLayout(line);
                  string visible = layout.Slice(scrollLeft, width);
                  canvas.WriteForced(0, y, visible, CSharpFarPaletteStyles.CommandLine(_palette));
                  if (match is not { IsHex: false } || match.LineStartOffset != lineStartOffset)
                      return;

                  int visibleStart = scrollLeft;
                  int visibleEnd = scrollLeft + width;
                  int matchStart = layout.CellOffsetFromSourceIndex(match.CharacterIndex - segmentStartIndex);
                  int matchEnd = layout.CellOffsetFromSourceIndex(match.CharacterIndex + match.CharacterLength - segmentStartIndex);
                  int highlightStart = Math.Max(visibleStart, matchStart);
                  int highlightEnd = Math.Min(visibleEnd, matchEnd);
                  if (highlightEnd <= highlightStart || highlightStart < visibleStart)
                      return;

                  string highlight = layout.Slice(highlightStart, highlightEnd - highlightStart);
                  if (ConsoleTextMetrics.GetCellWidth(highlight) > 0)
                      canvas.Write(highlightStart - visibleStart, y, highlight, CSharpFarPaletteStyles.InputHighlight(_palette));
              }
          ''', '''
              private void WriteTextLine(
                  IUiCanvas canvas,
                  PresentedLine presented,
                  string line,
                  int y,
                  int scrollLeft,
                  int width,
                  ViewerSearchMatch? match,
                  int segmentStartIndex)
              {
                  if (width <= 0)
                      return;

                  var layout = new ViewerTextLayout(line);
                  string visible = layout.Slice(scrollLeft, width);
                  canvas.WriteForced(0, y, visible, CSharpFarPaletteStyles.CommandLine(_palette));
                  if (match is not { IsHex: false } ||
                      match.LineStartOffset != presented.Source.StartOffset ||
                      !presented.TryMapSourceRange(
                          match.CharacterIndex,
                          match.CharacterLength,
                          out int presentedMatchStart,
                          out int presentedMatchLength))
                  {
                      return;
                  }

                  int segmentEndIndex = segmentStartIndex + line.Length;
                  int presentedMatchEnd = presentedMatchStart + presentedMatchLength;
                  if (presentedMatchEnd <= segmentStartIndex || presentedMatchStart >= segmentEndIndex)
                      return;

                  int localMatchStart = Math.Max(presentedMatchStart, segmentStartIndex) - segmentStartIndex;
                  int localMatchEnd = Math.Min(presentedMatchEnd, segmentEndIndex) - segmentStartIndex;
                  int visibleStart = scrollLeft;
                  int visibleEnd = scrollLeft + width;
                  int matchStart = layout.CellOffsetFromSourceIndex(localMatchStart);
                  int matchEnd = layout.CellOffsetFromSourceIndex(localMatchEnd);
                  int highlightStart = Math.Max(visibleStart, matchStart);
                  int highlightEnd = Math.Min(visibleEnd, matchEnd);
                  if (highlightEnd <= highlightStart)
                      return;

                  string highlight = layout.Slice(highlightStart, highlightEnd - highlightStart);
                  if (ConsoleTextMetrics.GetCellWidth(highlight) > 0)
                      canvas.Write(highlightStart - visibleStart, y, highlight, CSharpFarPaletteStyles.InputHighlight(_palette));
              }

              private static PresentedLine ResolvePresentationForSearch(
                  PresentedLine presented,
                  ViewerSearchMatch? match)
              {
                  if (match is not { IsHex: false } || match.LineStartOffset != presented.Source.StartOffset)
                      return presented;

                  return presented.TryMapSourceRange(match.CharacterIndex, match.CharacterLength, out _, out _)
                      ? presented
                      : PresentedLine.Raw(presented.Source);
              }
          ''')

          replace_once('src/CSharpFar.App/Viewer/LargeFileViewer.cs', '''
                  ViewerFunctionKeyAction(4, "Hex", ConsoleKey.F4),
                  ViewerFunctionKeyAction(6, "Edit", ConsoleKey.F6),
          ''', '''
                  ViewerFunctionKeyAction(4, "Hex", ConsoleKey.F4),
                  ViewerFunctionKeyAction(5, state.PresentationMode == ViewerPresentationMode.Auto ? "Raw" : "Auto", ConsoleKey.F5),
                  ViewerFunctionKeyAction(6, "Edit", ConsoleKey.F6),
          ''')

          # Search still runs on source text. Only the reveal position is translated to presented cells.
          p = Path('src/CSharpFar.App/Viewer/LargeFileViewer.cs')
          with p.open('r', encoding='utf-8', newline='') as f:
              text = f.read()
          eol = '\r\n' if '\r\n' in text else '\n'
          def simple(old, new, expected=None):
              global text
              old = old.replace('\n', eol); new = new.replace('\n', eol)
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'LargeFileViewer.cs: {old[:60]!r}: expected {expected}, found {count}')
              if expected is None and count == 0:
                  raise SystemExit(f'LargeFileViewer.cs: no match for {old[:60]!r}')
              text = text.replace(old, new)

          simple('RepeatSearch(reader, state, searchBackward:', 'RepeatSearch(filePath, reader, state, searchBackward:', 3)
          simple('ShowFindDialog(reader, state, size.Width);', 'ShowFindDialog(filePath, reader, state, size.Width);', 1)
          simple('private void ShowFindDialog(IFileByteReader reader, LargeFileViewerState state, int width)',
                 'private void ShowFindDialog(string filePath, IFileByteReader reader, LargeFileViewerState state, int width)', 1)
          simple('private void RepeatSearch(\n        IFileByteReader reader,',
                 'private void RepeatSearch(\n        string filePath,\n        IFileByteReader reader,', 1)
          simple('ShowFindDialog(reader, state, width);', 'ShowFindDialog(filePath, reader, state, width);', 1)
          simple('FindAndApply(reader, state, request, searchBackward: false, width);',
                 'FindAndApply(filePath, reader, state, request, searchBackward: false, width);', 1)
          simple('FindAndApply(reader, state, state.LastSearch, searchBackward, width);',
                 'FindAndApply(filePath, reader, state, state.LastSearch, searchBackward, width);', 1)
          simple('private void FindAndApply(\n        IFileByteReader reader,',
                 'private void FindAndApply(\n        string filePath,\n        IFileByteReader reader,', 1)

          old = '''
                  if (!match.IsHex && !state.WrapLines)
                  {
                      int rightEdge = state.HorizontalOffset + Math.Max(1, width);
                      if (match.CharacterIndex < state.HorizontalOffset || match.CharacterIndex >= rightEdge)
                          state.HorizontalOffset = Math.Max(0, match.CharacterIndex - 4);
                  }
                  else if (match.IsHex)
          '''.replace('\n', eol)
          new = '''
                  if (!match.IsHex && !state.WrapLines)
                  {
                      int captureCharacters = Math.Min(1_000_000, match.CharacterIndex + match.CharacterLength + 32);
                      var scanned = state.LineScanner
                          .ReadLinesAsync(match.LineStartOffset, 1, Math.Max(256, captureCharacters * 4))
                          .GetAwaiter()
                          .GetResult();
                      int matchCell = match.CharacterIndex;
                      if (scanned.Lines.Count > 0)
                      {
                          var presented = state.Presentation.Present(
                              state.PresentationMode,
                              filePath,
                              state.LineScanner,
                              scanned.Lines,
                              width)[0];
                          presented = ResolvePresentationForSearch(presented, match);
                          if (presented.TryMapSourceRange(
                                  match.CharacterIndex,
                                  match.CharacterLength,
                                  out int presentedMatchStart,
                                  out _))
                          {
                              matchCell = new ViewerTextLayout(presented.Text)
                                  .CellOffsetFromSourceIndex(presentedMatchStart);
                          }
                      }

                      int rightEdge = state.HorizontalOffset + Math.Max(1, width);
                      if (matchCell < state.HorizontalOffset || matchCell >= rightEdge)
                          state.HorizontalOffset = Math.Max(0, matchCell - 4);
                  }
                  else if (match.IsHex)
          '''.replace('\n', eol)
          if text.count(old) != 1:
              raise SystemExit(f'LargeFileViewer.cs: search reveal block matches {text.count(old)}')
          text = text.replace(old, new, 1)
          with p.open('w', encoding='utf-8', newline='') as f:
              f.write(text)

          # Documentation and built-in help.
          replace_once('docs/viewer-and-editor.md', '''
              Text-looking files open as text. Binary-looking files open as a 16-byte-per-row hexadecimal dump. Use `F4` or `H` to switch between text and hex display for the current file.
          ''', '''
              Text-looking files open as text. Binary-looking files open as a 16-byte-per-row hexadecimal dump. Use `F4` or `H` to switch between text and hex display for the current file.

              Text presentation defaults to `Auto`. Markdown (`.md` / `.markdown`) tables are presented as aligned terminal tables while navigation, wrapping and search continue to use the original source text. Press `F5` to switch to `Raw` and see the original representation; press `F5` again to return to `Auto`. The selection remains active while moving to sibling files with `+` / `-`. Hex output is unaffected.
          ''')
          replace_once('docs/viewer-and-editor.md', '''
              - `F4` or `H` — switch text/hex mode.
          ''', '''
              - `F4` or `H` — switch text/hex mode.
              - `F5` — switch automatic presentation / raw source representation.
          ''')
          replace_once('src/CSharpFar.App/Viewer/HelpContent.cs', '''
                      K("F4 / H",          "Switch text / hex mode"),
                      K("F6",              "Edit current file"),
          ''', '''
                      K("F4 / H",          "Switch text / hex mode"),
                      K("F5",              "Switch automatic / raw presentation"),
                      K("F6",              "Edit current file"),
          ''')

      - name: Verify diff
        run: |
          git diff --check
          git diff --stat

      - name: Restore
        run: dotnet restore CSharpFar.slnx

      - name: Build
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpFar.slnx --configuration Release --no-build --verbosity minimal

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-viewer-presentation.yml
          git add -A
          git commit -m "Implement automatic viewer presentation"
          git push origin HEAD:master
