name: Fix bounded viewer presentation look-ahead

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-viewer-presentation-lookahead.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded look-ahead
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/CSharpFar.App/Viewer/ViewerPresentation.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              '    internal const int MaxContextLineBytes = 16 * 1024;\n',
              '    internal const int MaxContextLineBytes = 16 * 1024;\n'
              '    internal const int MaxLookAheadLines = 8;\n'
              '    internal const int MaxLookAheadBytes = 64 * 1024;\n',
              'constants')

          replace_once(
              '            var context = new ViewerPresentationContext(visibleLines, before, [], viewportWidth);\n',
              '            IReadOnlyList<ScannedLine> after = ReadBoundedContextAfter(scanner, visibleLines[^1].NextOffset);\n'
              '            var context = new ViewerPresentationContext(visibleLines, before, after, viewportWidth);\n',
              'context')

          marker = '    private static IReadOnlyList<PresentedLine> Raw(IReadOnlyList<ScannedLine> source) =>\n'
          helper = '''    private static IReadOnlyList<ScannedLine> ReadBoundedContextAfter(LineScanner scanner, long firstOffset)
          {
              var result = new List<ScannedLine>(MaxLookAheadLines);
              long current = firstOffset;
              int inspectedBytes = 0;

              while (result.Count < MaxLookAheadLines && inspectedBytes < MaxLookAheadBytes)
              {
                  int remaining = MaxLookAheadBytes - inspectedBytes;
                  var scanned = scanner
                      .ReadLinesAsync(current, 1, Math.Min(MaxContextLineBytes, remaining))
                      .GetAwaiter()
                      .GetResult();
                  if (scanned.Lines.Count == 0)
                      break;

                  ScannedLine line = scanned.Lines[0];
                  long byteLength = line.NextOffset - line.StartOffset;
                  if (line.StartOffset != current || line.NextOffset <= current || byteLength > remaining)
                      break;

                  result.Add(line);
                  inspectedBytes += checked((int)byteLength);
                  current = line.NextOffset;
              }

              return result;
          }

          '''
          replace_once(marker, helper + marker, 'helper marker')
          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-viewer-presentation-lookahead.yml
          git add -A
          git commit -m "Fix bounded look-ahead for viewer presentation"
          git push origin HEAD:master
