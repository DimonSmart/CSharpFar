name: Apply inline Markdown viewer task

on:
  push:
    branches: [master]
    paths:
      - eng/apply-inline-markdown-task.py
      - .github/workflows/temp-inline-markdown.yml

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply implementation
        shell: bash
        run: |
          python eng/apply-inline-markdown-task.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/CSharpFar.Tests/MarkdownInlinePresentationTests.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('ViewerTextStyle style)\n', 'object style)\n', 1)
          text = text.replace('new PresentedStyleSpan(0, expected.Length, style)', 'new PresentedStyleSpan(0, expected.Length, (ViewerTextStyle)style)', 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('tests/CSharpFar.Tests/ViewerPresentationIntegrationTests.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('CSharpFarPalette.Default', 'new CSharpFarPalette()')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Restore
        run: dotnet restore CSharpFar.slnx

      - name: Build
        run: dotnet build CSharpFar.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpFar.slnx --configuration Release --no-build --verbosity minimal

      - name: Remove temporary implementation helpers
        run: rm eng/apply-inline-markdown-task.py .github/workflows/temp-inline-markdown.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add inline Markdown formatting to viewer"
          git push origin HEAD:master
