# Temporary one-shot release bootstrap. Remove after dispatch.
name: Publish v1.0.99 (temporary)

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-v1.0.99-once.yml

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    if: "github.event.head_commit.message == 'chore(release): publish v1.0.99'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v1.0.99 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag v1.0.99 "$GITHUB_SHA"
          git push origin refs/tags/v1.0.99

      - name: Dispatch Release on v1.0.99
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" -f ref=v1.0.99
