name: Azure Blob extension

on:
  push:
    branches: ['**']
    paths:
      - 'src/CSharpFar.Plugin.AzureBlob/**'
      - 'tests/CSharpFar.Plugin.AzureBlob.Tests/**'
      - 'eng/testing/build-azure-blob-extension.ps1'
      - 'eng/testing/verify-azure-blob-host.py'
      - '.github/workflows/azure-blob.yml'
  pull_request:
    paths:
      - 'src/CSharpFar.Plugin.AzureBlob/**'
      - 'tests/CSharpFar.Plugin.AzureBlob.Tests/**'
      - 'eng/testing/build-azure-blob-extension.ps1'
      - 'eng/testing/verify-azure-blob-host.py'
      - '.github/workflows/azure-blob.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run unit tests
        run: dotnet test tests/CSharpFar.Plugin.AzureBlob.Tests -c Release
      - name: Start Azurite
        run: |
          docker run -d --name csharpfar-azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0 azurite-blob --blobHost 0.0.0.0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1; then exit 0; fi
            sleep 1
          done
          docker logs csharpfar-azurite
          exit 1
      - name: Run real Azurite tests
        env:
          CSHARPFAR_AZURE_TEST_CONNECTION: UseDevelopmentStorage=true
        run: dotnet test tests/CSharpFar.Plugin.AzureBlob.Tests -c Release --no-build --filter Category=AzureIntegration --logger "console;verbosity=normal"
      - name: Build installable ZIP using published SDK
        shell: pwsh
        run: ./eng/testing/build-azure-blob-extension.ps1
      - name: Seed disposable published-host fixture
        env:
          CSHARPFAR_AZURE_HOST_FIXTURE: '1'
        run: dotnet test tests/CSharpFar.Plugin.AzureBlob.Tests -c Release --no-build --filter Category=AzureHostFixture
      - name: Verify real published Linux host
        run: |
          python3 -m pip install --break-system-packages pyte==0.8.2 Pillow==12.2.0
          mkdir -p artifacts/azure-host
          base=https://github.com/DimonSmart/CSharpFar/releases/download/v1.0.129
          asset=CSharpFar-v1.0.129-linux-x64.tar.gz
          curl --fail --location "$base/$asset" -o "artifacts/azure-host/$asset"
          curl --fail --location "$base/SHA256SUMS.txt" -o artifacts/azure-host/SHA256SUMS.txt
          (cd artifacts/azure-host; grep "  $asset$" SHA256SUMS.txt | sha256sum --check --strict; mkdir host; tar -xzf "$asset" -C host)
          python3 eng/testing/verify-azure-blob-host.py artifacts/azure-host/host/csharpfar artifacts/azure-blob/azure-blob artifacts/azure-blob/panel.png
      - name: Verify Debug host finds staged extension and persists global switch
        run: |
          dotnet build CSharpFar.slnx -c Debug
          python3 eng/testing/verify-azure-blob-host.py --debug-lifecycle src/CSharpFar.Host.Linux/bin/Debug/net10.0/csharpfar artifacts/azure-host/host/CSharpFar.config
      - name: Verify remote changes made by the host
        env:
          CSHARPFAR_AZURE_HOST_FIXTURE: '1'
        run: dotnet test tests/CSharpFar.Plugin.AzureBlob.Tests -c Release --no-build --filter Category=AzureHostVerify
      - name: Upload installation package
        uses: actions/upload-artifact@v4
        with:
          name: CSharpFar-AzureBlob-extension
          path: |
            artifacts/azure-blob/*.zip
            artifacts/azure-blob/*.sha256
            artifacts/azure-blob/panel.png
          if-no-files-found: error
